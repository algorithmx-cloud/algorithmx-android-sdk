# Builds, signs and uploads the SDK to the Maven Central Portal when a version
# tag such as 1.0.0 is pushed. The upload uses publishingType=USER_MANAGED, so
# the deployment waits in https://central.sonatype.com until someone presses
# "Publish"; nothing becomes public automatically.
#
# Repository secrets:
#   CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD  user token from the Central Portal (View Account → Generate User Token)
#   SIGNING_KEY                                      ASCII-armored PGP private key whose public key is on a keyserver
#   SIGNING_PASSWORD                                 passphrase of that key
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check build version matches the tag
        run: |
          version=$(grep -E "^version = '" build.gradle | sed -E "s/version = '(.*)'/\1/")
          test "$version" = "${GITHUB_REF_NAME}" || { echo "build.gradle version $version does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build, sign and stage
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew testReleaseUnitTest publishReleasePublicationToStagingRepository

      - name: Create the Central bundle
        run: |
          cd build/staging-deploy
          zip -r ../central-bundle.zip . -x '*maven-metadata*'

      - name: Upload to the Maven Central Portal
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          token=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${token}" \
            -F "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=android-sdk-${GITHUB_REF_NAME}&publishingType=USER_MANAGED"
